<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Seatwork 1</title>

    <style>
        body {
            background-image: url(https://i.pinimg.com/736x/d9/d3/78/d9d378ea782115cc86567363afc10970.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 14px 20px 40px;
        box-sizing: border-box;
      }

        #top {
            font-weight: bolder;
            font-size: 20px;
            color: #800020;
            text-align: center;
        }

        #verifbox {
            background-color: rgba(240, 239, 239, 0.8);
            width: 380px;
            max-width: 90%;
            min-height: 328px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            border-radius: 30px;
            box-sizing: border-box;
        }

        h4 {
            font-weight: bolder;
            font-size: 25px;
            color: #800020;
            margin-bottom: 10px;
        }

        h2{
            background-color: rgba(240, 239, 239, 0.9);;
            color: #800020;
            border-radius: 10px;
            margin: 2px;
            width: auto;
            font-weight: bold;
            text-align: center;
        }

        input[type="button"] {
            background-color: white;
            color: #800020;
            border: 2px solid #800020;
            border-radius: 10px;
            padding: 8px 20px;
            margin: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="text"] {
            background-color: white;
            color: #800020;
            border: 2px solid #800020;
            border-radius: 10px;
            padding: 10px;
            margin: 5px;
            width: 80%;
            font-weight: bold;
            box-sizing: border-box;
        }

        #result {
            background-color: rgba(240, 239, 239, 0.9);
            color: #800020;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            width: 380px;
            max-width: 90%;
            padding: 10px 20px;
            border-radius: 20px;
            box-sizing: border-box;
        }
        
        footer {
        background-color: rgba(128, 0, 32, 0.9);
        color: white;
        text-align: center;
        padding: 10px;
        font-size: 14px;
        font-weight: bold;
        width: 100%;
        box-sizing: border-box;
    }

        footer p {
            margin: 5px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div id="top">
            <h2>OBFV GIRLS' VOLLEYBALL CLUB MEMBERS</h2>
        </div>

        <div id="verifbox">
            <h4>Member Verification</h4>
            <p>Please fill out the required information.</p>

            <input type="text" id="Fname" placeholder="Enter first name"><br>
            <input type="text" id="Sname" placeholder="Enter last name"><br>
            <input type="button" py-click="verify" value="ENTER">
            <input type="button" py-click="clear" value="Clear">
        </div>

        <div id="result">
            <p id="message"></p>
        </div>
    </div>
    <script type="py" src="main.py"></script>

    <footer>
        <p>© 2026 OBFV Girls' Volleyball Club | Seatwork 1 | 2nd Quarter </p>
    </footer>

</body>
</html>
